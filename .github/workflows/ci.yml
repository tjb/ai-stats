name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aistats
          POSTGRES_PASSWORD: aistats
          POSTGRES_DB: aistats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aistats -d aistats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests read this and skip when it is unset.
      TEST_DATABASE_URL: postgres://aistats:aistats@localhost:5432/aistats_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run 'gofmt -w' in backend/):"
            for f in $unformatted; do
              echo "::error file=backend/$f::not gofmt-formatted"
              echo "  $f"
            done
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # hashFiles() is not available in a job-level `if`, so each step checks
      # for the Dockerfile itself.
      - name: No Dockerfile
        if: hashFiles('Dockerfile') == ''
        run: echo "::notice::No Dockerfile at the repository root; skipping image build."

      - uses: docker/setup-buildx-action@v3
        if: hashFiles('Dockerfile') != ''

      - name: Build image
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-stats:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
